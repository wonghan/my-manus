services:
  postgres:
    image: postgres:16-alpine
    container_name: my-manus-postgres
    environment:
      POSTGRES_DB: my_manus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: my-manus-redis
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
